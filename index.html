<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambiental Pro - Cadastro Roleta</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Faça o seu cadastro para girar a roleta da Ambiental Pro e concorrer a prêmios incríveis!">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./assets/favicon.png">

    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="chat-container">
        <header class="chat-header">
            <img src="./assets/Logo SVG.svg" alt="Ambiental Pro" class="brand-logo">
        </header>

        <main class="chat-history" id="chat-history">
            <!-- Messages will be injected here dynamically -->
            <div id="input-container" class="input-container">
                <div id="chat-form" class="chat-form">
                    <input type="text" id="chat-response-field" class="user-input" placeholder="Digite sua resposta..."
                        autocomplete="nope" autocorrect="off" spellcheck="false" data-lpignore="true" disabled>
                    <button type="button" id="send-button" class="send-button" disabled>
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="3"
                            fill="none" stroke-linecap="round" stroke-linejoin="round" class="send-icon">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div id="button-choices" class="button-choices" style="display: none;">
                    <!-- Buttons will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>

</html>
